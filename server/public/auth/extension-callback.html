<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect extension — Element Armory</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    h1 { font-size: 1.25rem; }
    .muted { color: #6b7280; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>Connect extension</h1>
  <p id="status" class="muted">Passing code to extension…</p>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const install_id = params.get('install_id');
      const extensionId = params.get('extension_id') || '';

      if (!code || !install_id) {
        document.getElementById('status').textContent = 'Missing code or install_id. Close this tab.';
        return;
      }

      try {
        if (extensionId) {
          window.location.href = 'chrome-extension://' + extensionId + '/?code=' + encodeURIComponent(code) + '&install_id=' + encodeURIComponent(install_id);
        } else {
          document.getElementById('status').textContent = 'Code: ' + code + ' (add extension_id to URL for redirect). You can close this tab.';
        }
      } catch (e) {
        document.getElementById('status').textContent = 'Could not redirect. Copy the code from the URL and paste it in the extension.';
      }
    })();
  </script>
</body>
</html>
