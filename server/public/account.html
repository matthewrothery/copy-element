<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account — Element Armory</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    a { color: #3b82f6; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.5rem 0; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    button { padding: 0.25rem 0.5rem; font-size: 0.875rem; cursor: pointer; }
    .muted { color: #6b7280; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>Account</h1>
  <p id="user-info" class="muted">Loading…</p>
  <p><a href="/billing.html">Billing</a> (coming in Phase 3)</p>
  <h2>Connect extension</h2>
  <p class="muted">Get a one-time code to connect the extension to this account.</p>
  <form id="code-form">
    <input type="text" id="install-id-input" placeholder="Install ID (from extension)" style="width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box;" />
    <button type="submit">Get code</button>
  </form>
  <p id="code-result" class="muted" style="word-break: break-all;" hidden></p>
  <h2>Linked installs</h2>
  <ul id="installs"></ul>
  <script>
    async function load() {
      const meRes = await fetch('/api/me', { credentials: 'include' });
      const me = await meRes.json();
      if (meRes.status === 401 || !me.user) {
        window.location.href = '/sign-in.html?redirect=' + encodeURIComponent(window.location.pathname);
        return;
      }
      document.getElementById('user-info').textContent = me.user ? me.user.email : '';

      const instRes = await fetch('/api/installs', { credentials: 'include' });
      if (instRes.status !== 200) {
        document.getElementById('installs').innerHTML = '<li class="muted">Failed to load installs.</li>';
        return;
      }
      const { installs } = await instRes.json();
      const ul = document.getElementById('installs');
      if (!installs || installs.length === 0) {
        ul.innerHTML = '<li class="muted">No linked installs.</li>';
        return;
      }
      ul.innerHTML = installs.map(function (inst) {
        return '<li><span>' + inst.install_id + '</span> <span class="muted">' + (inst.extension_version || '') + '</span> <button data-install-id="' + inst.install_id + '" type="button">Unlink</button></li>';
      }).join('');
      ul.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const install_id = btn.getAttribute('data-install-id');
          const res = await fetch('/api/installs/unlink', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ install_id }),
            credentials: 'include'
          });
          if (res.ok) load();
        });
      });
    }
    document.getElementById('code-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const install_id = document.getElementById('install-id-input').value.trim();
      if (!install_id) return;
      const resultEl = document.getElementById('code-result');
      try {
        const res = await fetch('/api/auth/extension-session/code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ install_id }),
          credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) {
          resultEl.textContent = data.error || 'Failed to get code';
          resultEl.hidden = false;
          return;
        }
        const params = new URLSearchParams({ code: data.code, install_id: install_id });
        resultEl.innerHTML = 'Code created. <a href="/auth/extension-callback.html?' + params.toString() + '">Open callback page</a> to pass code to extension.';
        resultEl.hidden = false;
      } catch (err) {
        resultEl.textContent = 'Network error.';
        resultEl.hidden = false;
      }
    });
    load();
  </script>
</body>
</html>
