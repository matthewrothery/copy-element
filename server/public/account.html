<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account — Element Armory</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    .btn { display: inline-block; padding: 0.5rem 1rem; margin: 0.25rem 0.25rem 0 0; background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.875rem; }
    .btn.secondary { background: #6b7280; }
    #user { margin: 1rem 0; }
    #entitlement { font-size: 0.875rem; color: #6b7280; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Account</h1>
  <div id="user"></div>
  <div id="entitlement"></div>
  <div>
    <a href="/billing.html" class="btn">Billing</a>
    <a href="/sign-in.html" class="btn secondary">Sign in</a>
  </div>
  <p id="installs" style="margin-top: 1.5rem;"></p>

  <script>
    (function () {
      const base = window.location.origin;
      const userEl = document.getElementById('user');
      const entitlementEl = document.getElementById('entitlement');
      const installsEl = document.getElementById('installs');

      async function load() {
        const meRes = await fetch(base + '/api/me', { credentials: 'include' });
        const me = await meRes.json().catch(() => ({}));
        if (!me.user) {
          userEl.innerHTML = '<p>Not signed in. <a href="/sign-in.html">Sign in</a></p>';
          entitlementEl.textContent = '';
          return;
        }
        userEl.innerHTML = '<p>Signed in as <strong>' + (me.user.email || me.user.name || me.user.id) + '</strong></p>';

        const entRes = await fetch(base + '/api/billing/entitlement', { credentials: 'include' });
        if (entRes.ok) {
          const ent = await entRes.json();
          entitlementEl.textContent = 'Plan: ' + ent.plan_code + (ent.active ? ' (active)' : '');
        } else {
          entitlementEl.textContent = '';
        }

        const instRes = await fetch(base + '/api/installs', { credentials: 'include' });
        if (instRes.ok) {
          const data = await instRes.json();
          if (data.installs && data.installs.length > 0) {
            installsEl.innerHTML = '<strong>Linked installs:</strong> ' + data.installs.length;
          } else {
            installsEl.textContent = 'No linked installs. Connect the extension from this account to link.';
          }
        }
      }
      load();
    })();
  </script>
</body>
</html>
