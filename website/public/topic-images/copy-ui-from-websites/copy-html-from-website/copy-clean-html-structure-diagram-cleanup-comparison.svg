<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img"><title>Manual DevTools vs Automated Cleaner</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="188.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Manual DevTools</text><rect x="24" y="74" width="329" height="216" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Copy HTML from inspector</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Manually remove inline styles</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Delete unnecessary classes</text><text x="36" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Rewrite semantic tags</text><text x="36" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Test in project</text><text x="36" y="277" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Time: 15-30 min per component</text><rect x="367" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="531.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Automated Cleaner</text><rect x="367" y="74" width="329" height="216" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="379" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Paste HTML into tool</text><text x="379" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Select cleanup options</text><text x="379" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Remove attributes, styles, classes</text><text x="379" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Review output</text><text x="379" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Paste into project</text><text x="379" y="277" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Time: 2-5 min per component</text></svg>