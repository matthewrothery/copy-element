<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img"><title>Flat Navigation vs Hierarchical Navigation</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="188.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Flat Navigation</text><rect x="24" y="74" width="329" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Best for simple products</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">All items visible at once</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Fast to scan</text><text x="36" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Limited scalability</text><rect x="367" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="531.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Hierarchical Navigation</text><rect x="367" y="74" width="329" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="379" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Best for complex products</text><text x="379" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Categories with subcategories</text><text x="379" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Organized by workflow</text><text x="379" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Scales to many features</text></svg>