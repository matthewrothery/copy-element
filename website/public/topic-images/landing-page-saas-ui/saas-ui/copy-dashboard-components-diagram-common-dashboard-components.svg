<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img"><title>Cards &amp; Metrics vs Tables &amp; Lists vs Charts &amp; Visualizations</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="214.66666666666666" height="44" rx="8" fill="#3b82f6"/><text x="131.33333333333331" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Cards &amp; Metrics</text><rect x="24" y="74" width="214.66666666666666" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Metric card (number + trend)</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Status card (indicator + label)</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Summary card (key-value pairs)</text><text x="36" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Progress card (bar + percentage)</text><rect x="252.66666666666666" y="24" width="214.66666666666666" height="44" rx="8" fill="#3b82f6"/><text x="360" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Tables &amp; Lists</text><rect x="252.66666666666666" y="74" width="214.66666666666666" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="264.66666666666663" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Data table (sortable, filterable)</text><text x="264.66666666666663" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Activity log (timestamp + action)</text><text x="264.66666666666663" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">User list (avatar + details)</text><text x="264.66666666666663" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Transaction table (columns + pagination)</text><rect x="481.3333333333333" y="24" width="214.66666666666666" height="44" rx="8" fill="#3b82f6"/><text x="588.6666666666666" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Charts &amp; Visualizations</text><rect x="481.3333333333333" y="74" width="214.66666666666666" height="144" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="493.3333333333333" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Line chart (time-series data)</text><text x="493.3333333333333" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Bar chart (categorical comparison)</text><text x="493.3333333333333" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Pie chart (composition)</text><text x="493.3333333333333" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Heatmap (density visualization)</text></svg>