<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img"><title>Vibe Coding vs Design Systems</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="188.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Vibe Coding</text><rect x="24" y="74" width="329" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Fast (15 min per component)</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Flexible and iterative</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">No design team needed</text><text x="36" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Great for prototyping</text><text x="36" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Less consistent at scale</text><rect x="367" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="531.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Design Systems</text><rect x="367" y="74" width="329" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="379" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Slower initial setup</text><text x="379" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Consistent across products</text><text x="379" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Requires design governance</text><text x="379" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Better for large teams</text><text x="379" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Scales to 100+ components</text></svg>