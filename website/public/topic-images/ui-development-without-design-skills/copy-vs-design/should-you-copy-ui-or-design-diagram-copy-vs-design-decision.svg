<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img"><title>Copy UI vs Design From Scratch</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="188.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Copy UI</text><rect x="24" y="74" width="329" height="216" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Need to ship fast</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Building standard components</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Learning design patterns</text><text x="36" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">No designer on team</text><text x="36" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">MVP validation phase</text><text x="36" y="277" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Working with AI tools</text><rect x="367" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="531.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Design From Scratch</text><rect x="367" y="74" width="329" height="216" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="379" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Unique brand identity needed</text><text x="379" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">