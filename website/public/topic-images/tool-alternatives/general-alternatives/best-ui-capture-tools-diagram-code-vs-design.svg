<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img"><title>Code-First Tools vs Design-First Tools</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="188.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Code-First Tools</text><rect x="24" y="74" width="329" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Output: HTML + CSS</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Speed: Seconds</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Reusable: Yes</text><text x="36" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">AI Compatible: Yes</text><text x="36" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Best for: Developers</text><rect x="367" y="24" width="329" height="44" rx="8" fill="#3b82f6"/><text x="531.5" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Design-First Tools</text><rect x="367" y="74" width="329" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="379" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Output: Design files</text><text x="379" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Speed: Minutes</text><text x="379" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Reusable: Requires export</text><text x="379" y="205" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">AI Compatible: No</text><text x="379" y="241" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Best for: Designers</text></svg>