<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 208" width="720" height="208" role="img"><title>Extraction Tool vs Your Intent vs Outcome</title><rect width="100%" height="100%" fill="#f8fafc"/><rect x="24" y="24" width="214.66666666666666" height="44" rx="8" fill="#3b82f6"/><text x="131.33333333333331" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Extraction Tool</text><rect x="24" y="74" width="214.66666666666666" height="108" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="36" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Neutral technology</text><text x="36" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Extracts code</text><text x="36" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">No legal bias</text><rect x="252.66666666666666" y="24" width="214.66666666666666" height="44" rx="8" fill="#3b82f6"/><text x="360" y="51" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" font-weight="600" fill="#ffffff">Your Intent</text><rect x="252.66666666666666" y="74" width="214.66666666666666" height="108" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/><text x="264.66666666666663" y="97" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Learning = safe</text><text x="264.66666666666663" y="133" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Commercial reuse = risky</text><text x="264.66666666666663" y="169" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#111827">Modification = safer</text><rect x="481.3333333333333" y="24" width="214.66666666666666" height="44" rx="8" fill="#3b82f6"/><text x="588.6666666666666" y="51"