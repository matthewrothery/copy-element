  server:
    image: element-armory-server
    container_name: element-armory-server
    hostname: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: /bin/sh -c "cd /app && npm install && npm run migrate && npm run dev"
    ports:
      - "${SERVER_PORT:-8840}:80"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      # So Better Auth trusts redirects/callbacks from the website (different port in dev).
      - FRONTEND_URL=http://localhost:${WEBSITE_PORT:-9900}
      # AWS credentials — injected from the host shell by aws-vault exec in start.sh.
      # These override the empty values in server/.env.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    volumes:
      - ./server/:/app
    networks:
      - element-armory-env
    restart: "no"

  website:
    image: node:24-alpine3.23
    container_name: element-armory-website
    hostname: website
    working_dir: /app
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://server
      # Browser hits the server directly for auth and API (avoids 404 on Sign in with Google when rewrites don't apply).
      NEXT_PUBLIC_API_URL: http://localhost:${SERVER_PORT:-8840}
    ports:
      - "${WEBSITE_PORT:-9900}:3000"
    volumes:
      - ./website:/app
    command: /bin/sh -c "npm install && npm run dev"
    networks:
      - element-armory-env
    restart: "no"

