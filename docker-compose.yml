  localstack:
    image: localstack/localstack:3
    container_name: element-armory-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ses
      - AWS_DEFAULT_REGION=us-east-2
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
    networks:
      - element-armory-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

  ses-viewer:
    build: https://github.com/veertech/localstack-aws-ses-email-viewer.git
    container_name: element-armory-ses-viewer
    environment:
      - LOCALSTACK_HOST=http://localstack:4566
      - PORT=3005
    ports:
      - "3005:3005"
    networks:
      - element-armory-env
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  server:
    image: element-armory-server
    container_name: element-armory-server
    hostname: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: /bin/sh -c "cd /app && npm install && npm run migrate && npm run dev"
    ports:
      - "${SERVER_PORT:-8840}:80"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      # So Better Auth trusts redirects/callbacks from the website (different port in dev).
      - FRONTEND_URL=http://localhost:${WEBSITE_PORT:-9900}
      # AWS credentials — loaded from root .env.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./server/:/app
    networks:
      - element-armory-env
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  website:
    image: node:24-alpine3.23
    container_name: element-armory-website
    hostname: website
    working_dir: /app
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://server
      # Browser hits the server directly for auth and API (avoids 404 on Sign in with Google when rewrites don't apply).
      NEXT_PUBLIC_API_URL: http://localhost:${SERVER_PORT:-8840}
    ports:
      - "${WEBSITE_PORT:-9900}:3000"
    volumes:
      - ./website:/app
    command: /bin/sh -c "npm install && npm run dev"
    networks:
      - element-armory-env
    restart: "no"

  admin:
    image: node:24-alpine3.23
    container_name: element-armory-admin
    hostname: admin
    working_dir: /app
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://server
    ports:
      - "${ADMIN_PORT:-9920}:5174"
    volumes:
      - ./admin:/app
    command: /bin/sh -c "npm install && npm run dev"
    networks:
      - element-armory-env
    restart: "no"

  mcp-server:
    image: node:24-alpine3.23
    container_name: element-armory-mcp-server
    hostname: mcp-server
    working_dir: /app
    env_file:
      - ./server/.env
    environment:
      MCP_PORT: 80
    ports:
      - "${MCP_PORT:-9950}:80"
    volumes:
      - ./mcp-server:/app
    command: /bin/sh -c "npm install && npm run dev"
    networks:
      - element-armory-env
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

volumes:
  element_armory_server_data:
  localstack_data:

networks:
  element-armory-env:
    driver: bridge
