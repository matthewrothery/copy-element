name: element-armory-prod

# Memory budget for the 1 GB t3.micro + 4 GB swap host:
#   nginx 64 / 128m   app 512 / 768m   mcp 256 / 384m   auto-blogger 384 / 512m
# Total cap ~1216 MiB; swap absorbs spikes when auto-blogger generation overlaps app load.

services:
  nginx:
    image: nginx:alpine
    container_name: element-armory-nginx
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/element-armory/nginx.conf:/etc/nginx/nginx.conf:ro
      - element-armory-nginx-cache:/var/cache/nginx
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    networks:
      - element-armory-network

  app:
    image: ${ECR_REGISTRY}/${ECR_SERVER_REPO}:latest
    container_name: element-armory-app
    env_file: /home/ec2-user/element-armory/.env.server
    ports:
      - "3000:80"
    volumes:
      - /home/ec2-user/element-armory/data:/data
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 768m
    networks:
      - element-armory-network

  mcp:
    image: ${ECR_REGISTRY}/${ECR_MCP_REPO}:latest
    container_name: element-armory-mcp
    env_file: /home/ec2-user/element-armory/.env.mcp
    environment:
      MCP_PORT: 3001
      MAIN_SERVER_URL: http://app:80
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 384m
    networks:
      - element-armory-network

  auto-blogger:
    image: ${ECR_REGISTRY}/${ECR_AUTO_BLOGGER_REPO}:latest
    container_name: element-armory-auto-blogger
    env_file: /home/ec2-user/element-armory/.env.auto-blogger
    volumes:
      - /home/ec2-user/element-armory/data:/data
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    networks:
      - element-armory-network

volumes:
  element-armory-nginx-cache:

networks:
  element-armory-network:
    driver: bridge
