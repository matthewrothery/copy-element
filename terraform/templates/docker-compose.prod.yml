name: element-armory-prod

services:
  nginx:
    image: nginx:alpine
    container_name: element-armory-nginx
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/element-armory/nginx.conf:/etc/nginx/nginx.conf:ro
      - element-armory-nginx-cache:/var/cache/nginx
    restart: unless-stopped
    networks:
      - element-armory-network

  app:
    image: ${ECR_REGISTRY}/${ECR_SERVER_REPO}:latest
    container_name: element-armory-app
    environment:
      NODE_ENV: production
      PORT: 80
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      S3_ASSETS_BUCKET: ${S3_ASSETS_BUCKET}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "3000:80"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - element-armory-network

  mcp:
    image: ${ECR_REGISTRY}/${ECR_MCP_REPO}:latest
    container_name: element-armory-mcp
    environment:
      NODE_ENV: production
      MCP_PORT: 3001
      MAIN_SERVER_URL: http://app:80
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - element-armory-network

volumes:
  element-armory-nginx-cache:

networks:
  element-armory-network:
    driver: bridge
