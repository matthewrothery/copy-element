# Deploy marketing website to S3 and invalidate CloudFront.
name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Next.js
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://app.elementarmory.com' }}
          NEXT_PUBLIC_CHROME_STORE_URL: ${{ vars.NEXT_PUBLIC_CHROME_STORE_URL || 'https://chromewebstore.google.com/detail/element-armory-%E2%80%93-capture/ihndemikooddnhleamneebgedomkench' }}
        run: npm run build
        working-directory: website

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3 with long cache lifetime
        run: |
          aws s3 sync website/out s3://${{ secrets.S3_WEBSITE_BUCKET }} --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML to S3 with short cache lifetime
        run: |
          aws s3 sync website/out s3://${{ secrets.S3_WEBSITE_BUCKET }} \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=300, s-maxage=300"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_WEBSITE_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Publish internal-links manifest for auto-blogger Lambda
        # Note: `if: secrets.X != ''` does NOT work at step level — GitHub
        # Actions does not expose secrets in `if:` conditions, so the step
        # would silently skip. The publish script itself errors loudly if
        # AUTO_BLOG_S3_BUCKET is unset, which is the behavior we want.
        env:
          AUTO_BLOG_S3_BUCKET: ${{ secrets.AUTO_BLOG_S3_BUCKET }}
        working-directory: website
        run: node --import tsx scripts/publishInternalLinksManifest.mts
