# Deploy admin SPA to S3 and invalidate CloudFront.
name: Deploy admin

on:
  push:
    branches: [master]
    paths:
      - 'admin/**'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin

      - name: Build
        env:
          VITE_API_BASE_URL: https://admin.elementarmory.com
        run: npm run build
        working-directory: admin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3 with long cache lifetime
        run: |
          aws s3 sync admin/dist/assets s3://${{ secrets.S3_ADMIN_BUCKET }}/assets \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML and root files with short cache lifetime
        run: |
          aws s3 sync admin/dist s3://${{ secrets.S3_ADMIN_BUCKET }} \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ADMIN_DISTRIBUTION_ID }} \
            --paths "/*"
