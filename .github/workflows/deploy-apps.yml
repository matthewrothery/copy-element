# Deploy server and mcp-server to EC2 via ECR + SSM.
# Builds for linux/amd64 to match EC2 (t3).
name: Deploy apps to EC2

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "mcp-server/**"
      - "terraform/scripts/start.sh"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build_server:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/element-armory-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build_mcp:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build and push mcp-server
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          file: ./mcp-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/element-armory-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy_ec2:
    runs-on: ubuntu-latest
    needs: [build_server, build_mcp]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync start.sh to EC2
        run: |
          ENCODED=$(base64 -w 0 terraform/scripts/start.sh)
          PARAMS=$(jq -n --arg e "$ENCODED" \
            '{"commands":["printf \"%s\" \($e) | base64 -d > /home/ec2-user/element-armory/start.sh","chmod +x /home/ec2-user/element-armory/start.sh"]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text | tr -d '\n\r' | xargs)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Deploy to EC2 via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ec2-user /home/ec2-user/element-armory/start.sh"]' \
            --query 'Command.CommandId' \
            --output text | tr -d '\n\r' | xargs)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $COMMAND_ID"

      - name: Wait for SSM command
        run: |
          COMMAND_ID="$(echo '${{ steps.ssm.outputs.command_id }}' | tr -d '\n\r' | xargs)"
          INSTANCE_ID="$(echo '${{ secrets.EC2_INSTANCE_ID }}' | tr -d '\n\r' | xargs)"
          if aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            echo "Deployment completed successfully"
            exit 0
          fi
          echo "SSM command did not reach Success (waiter exited or timed out)"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "Unknown")
          echo "Final status: $STATUS"
          echo "::error::Deployment failed. If migrations ran, check stdout below for migration errors."
          echo "=== SSM command stdout ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text 2>/dev/null || true
          echo "=== SSM command stderr ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text 2>/dev/null || true
          exit 1
